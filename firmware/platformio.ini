; Bluedoor firmware — one codebase, two build targets:
;   logger : Phase 0.5 would-open logger (detection only, cannot actuate)
;   v1     : production — same pipeline + optocoupler pulse output (GPIO 26)
; Board: Freenove ESP32-WROOM (FNK0090) = standard ESP32-WROOM-32E devkit, 4 MB flash

[platformio]
default_envs = logger

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
; min_spiffs: two 1.9 MB app slots (keeps OTA possible) + ~190 KB filesystem for logs
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; -Wl,--wrap: route every IDF abort through __wrap_esp_system_abort in main.cpp,
; which saves the abort message to RTC RAM so the next boot can log why it died
build_flags = -DCORE_DEBUG_LEVEL=1 -Wl,--wrap=esp_system_abort

[env:logger]
build_flags = ${env.build_flags} -DFW_VERSION=\"0.5.0\" -DPULSE_ENABLED=0

[env:v1]
build_flags = ${env.build_flags} -DFW_VERSION=\"1.0.0-a1\" -DPULSE_ENABLED=1
