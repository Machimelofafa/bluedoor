; Bluedoor firmware — one codebase, five build targets (see README.md):
;   beacon     : the board in the car (BLE advertising only)
;   logger-ble : listen-only scanner, full arrival logic, never drives a pin
;   v1-ble     : production scanner — logger-ble + the GPIO 26 pulse
;   survey     : attended two-radio census for drive-through tests
;   logger/v1  : classic-radio variants of the above (original design, reference)
; Board: any ESP32-WROOM-32 devkit with 4 MB flash (tested on Freenove FNK0090)

[platformio]
default_envs = logger-ble

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
; min_spiffs: two 1.9 MB app slots (keeps OTA possible) + ~190 KB filesystem for logs
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; -Wl,--wrap: route every IDF abort through __wrap_esp_system_abort in main.cpp,
; which saves the abort message to RTC RAM so the next boot can log why it died
build_flags = -DCORE_DEBUG_LEVEL=1 -Wl,--wrap=esp_system_abort

[env:logger]
build_flags = ${env.build_flags} -DFW_VERSION=\"0.5.0\" -DPULSE_ENABLED=0

[env:v1]
build_flags = ${env.build_flags} -DFW_VERSION=\"1.0.0-a1\" -DPULSE_ENABLED=1

; Listen-only scanner watching the BLE beacon carried in the car. Needs
; BEACON_BLE_MAC in config.h (the beacon prints it at boot; the BLE_SURVEY
; census also shows it).
[env:logger-ble]
build_flags = ${env.build_flags} -DFW_VERSION=\"0.5.0-ble\" -DPULSE_ENABLED=0 -DDETECT_BLE=1

; Production scanner: logger-ble's detection + the GPIO 26 pulse. Boots in
; DRY-RUN. This is the one to commission with.
[env:v1-ble]
build_flags = ${env.build_flags} -DFW_VERSION=\"1.0.0-ble-a1\" -DPULSE_ENABLED=1 -DDETECT_BLE=1

; Attended census build: BLE plus classic inquiry, so drive-through tests
; capture classic devices and BLE advertisers in one pass. Inquiry + WiFi
; crashes the prebuilt BT controller after a few hours — do not leave it
; running unattended; reflash logger-ble afterwards.
[env:survey]
build_flags = ${env.build_flags} -DFW_VERSION=\"0.5.0-survey\" -DPULSE_ENABLED=0 -DDETECT_BLE=1 -DSURVEY_CLASSIC=1

; The in-car beacon (the second ESP32): burned-in public MAC, name-carrying
; non-connectable advertising every 100 ms at +9 dBm. No WiFi, no OTA, no flash
; writes — car USB cuts power ~10-15 s after ignition off, so nothing may
; depend on a clean shutdown. src/beacon.cpp only; deliberately not
; ${env.build_flags}: the esp_system_abort wrap needs main.cpp's RTC-forensics
; handler, which this build excludes.
[env:beacon]
build_flags = -DCORE_DEBUG_LEVEL=1 -DFW_VERSION=\"1.0.0-beacon\" -DBEACON_BUILD=1
build_src_filter = +<*> -<main.cpp>
